    {% if recaptcha_site_key %}
    <script>
    window.chatRecaptchaReady = false;
    window.chatRenderCaptcha = null;
    function onRecaptchaLoad() {
        window.chatRecaptchaReady = true;
        if (window.chatRenderCaptcha) window.chatRenderCaptcha();
    }
    </script>
    <script src="https://www.google.com/recaptcha/api.js?onload=onRecaptchaLoad&render=explicit" async defer></script>
    {% endif %}
    <script>
        (function () {
            var CHAT_I18N = {
                fr: {
                    chatTitle: "Votre assistant financier",
                    chatPlaceholder: "Votre message…",
                    chatSend: "Envoyer",
                    captchaHelp: "Veuillez valider le CAPTCHA puis cliquer sur Renvoyer.",
                    captchaResend: "Renvoyer",
                    chatWelcome: "Besoin d'aide ? Pose une question.",
                    chatLoading: "Réponse en cours…",
                    chatTimeout: "Délai dépassé (8 s). Réessayez.",
                    chatConnError: "Erreur de connexion.",
                },
                en: {
                    chatTitle: "Your Financial Assistant",
                    chatPlaceholder: "Your message…",
                    chatSend: "Send",
                    captchaHelp: "Please validate the CAPTCHA then click Resend.",
                    captchaResend: "Resend",
                    chatWelcome: "Need help? Ask a question.",
                    chatLoading: "Waiting for a reply…",
                    chatTimeout: "Timed out (8 s). Please try again.",
                    chatConnError: "Connection error.",
                }
            };
            var CHAT_FETCH_MS = 8000;
            var CHAT_CLOCK_SVG = "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" width=\"20\" height=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 6v6l4 2\"/></svg>";

            var recaptchaSiteKey = {{ recaptcha_site_key | default('') | tojson }};
            var savedLang = (function () {
                try { return localStorage.getItem("page_lang") || "en"; } catch (e) { return "en"; }
            })();
            var t0 = CHAT_I18N[savedLang] || CHAT_I18N.en;
            var messages = [{ role: "assistant", content: t0.chatWelcome }];
            var panel = document.getElementById("chatPanel");
            var msgsEl = document.getElementById("chatMessages");
            var inputEl = document.getElementById("chatInput");
            var captchaWrap = document.getElementById("chatCaptchaWrap");
            var captchaWidget = document.getElementById("chatCaptchaWidget");
            var captchaResendBtn = document.getElementById("chatCaptchaResend");
            var pendingForCaptcha = null;

            function escapeHtml(s) {
                var d = document.createElement("div");
                d.textContent = s;
                return d.innerHTML;
            }
            function formatBotContent(content) {
                if (!content) return "";
                var linkRe = /\[([^\]]*)\]\((https?:\/\/[^\)]+)\)/g;
                var out = "";
                var lastIdx = 0;
                var match;
                while ((match = linkRe.exec(content)) !== null) {
                    out += escapeHtml(content.slice(lastIdx, match.index));
                    out += "<a href=\"" + escapeHtml(match[2]) + "\" target=\"_blank\" rel=\"noopener noreferrer\">" + escapeHtml(match[1]) + "</a>";
                    lastIdx = linkRe.lastIndex;
                }
                out += escapeHtml(content.slice(lastIdx));
                return out;
            }
            function getChatT() {
                var lang = "en";
                try { lang = localStorage.getItem("page_lang") || "en"; } catch (e) {}
                return CHAT_I18N[lang] || CHAT_I18N.en;
            }
            function renderMessages() {
                if (!msgsEl) return;
                var t = getChatT();
                msgsEl.innerHTML = messages.map(function (m) {
                    if (m.loading) {
                        return "<div class=\"chat-msg bot chat-msg-loading\" aria-live=\"polite\"><span class=\"chat-loading-clock\" aria-hidden=\"true\">" + CHAT_CLOCK_SVG + "</span><span>" + escapeHtml(t.chatLoading) + "</span></div>";
                    }
                    var c = m.role === "user" ? "user" : "bot";
                    var label = m.role === "user" ? "Vous: " : "";
                    var body = m.role === "user" ? escapeHtml(m.content) : formatBotContent(m.content);
                    return "<div class=\"chat-msg " + c + "\">" + (label ? "<strong>" + label + "</strong> " : "") + body + "</div>";
                }).join("");
                msgsEl.scrollTop = msgsEl.scrollHeight;
            }
            function removeLoadingIfAny() {
                var n = messages.length;
                if (n && messages[n - 1].loading) messages.pop();
            }
            function setChatInputBusy(busy) {
                var sb = document.getElementById("chatSend");
                if (sb) sb.disabled = !!busy;
                if (inputEl) inputEl.disabled = !!busy;
            }
            function doFetch(msgs, captchaToken, signal) {
                var payload = { messages: msgs };
                if (captchaToken) payload.captcha_token = captchaToken;
                var opts = {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                };
                if (signal) opts.signal = signal;
                return fetch("/api/chat", opts).then(function (r) {
                    return r.json().then(function (data) { return { ok: r.ok, status: r.status, data: data }; });
                });
            }
            function sendToApi(optCaptchaToken) {
                if (!inputEl) return;
                var text = (inputEl.value || "").trim();
                if (pendingForCaptcha) text = pendingForCaptcha.text;
                if (!text) return;
                var msgsToSend = messages;
                if (!pendingForCaptcha) {
                    messages.push({ role: "user", content: text });
                    inputEl.value = "";
                } else {
                    msgsToSend = messages.concat([{ role: "user", content: text }]);
                }
                renderMessages();
                if (captchaWrap) captchaWrap.style.display = "none";
                pendingForCaptcha = null;
                messages.push({ role: "assistant", loading: true });
                renderMessages();
                setChatInputBusy(true);
                var ac = new AbortController();
                var abortTimer = setTimeout(function () { ac.abort(); }, CHAT_FETCH_MS);
                doFetch(msgsToSend, optCaptchaToken, ac.signal).then(function (res) {
                    removeLoadingIfAny();
                    if (!res.ok && res.status === 429 && res.data && res.data.require_captcha && recaptchaSiteKey) {
                        if (!pendingForCaptcha) {
                            messages.pop();
                            pendingForCaptcha = { messages: messages.slice(), text: text };
                            messages.push({ role: "assistant", content: "Veuillez valider le CAPTCHA pour continuer." });
                            function renderCaptcha() {
                                if (!captchaWidget || !recaptchaSiteKey) return;
                                captchaWidget.innerHTML = "";
                                if (typeof grecaptcha !== "undefined" && grecaptcha.render) {
                                    grecaptcha.render(captchaWidget, { sitekey: recaptchaSiteKey });
                                }
                            }
                            window.chatRenderCaptcha = renderCaptcha;
                            if (window.chatRecaptchaReady) renderCaptcha();
                            if (captchaWrap) captchaWrap.style.display = "block";
                            if (captchaResendBtn) captchaResendBtn.onclick = function () {
                                var token = (typeof grecaptcha !== "undefined" && grecaptcha.getResponse) ? grecaptcha.getResponse() : "";
                                if (!token) return;
                                sendToApi(token);
                            };
                        }
                        renderMessages();
                        return;
                    }
                    if (res.data && res.data.error) {
                        messages.push({ role: "assistant", content: "Erreur: " + res.data.error });
                    } else {
                        messages.push({ role: "assistant", content: res.data.reply || "" });
                    }
                    renderMessages();
                }).catch(function (err) {
                    removeLoadingIfAny();
                    if (!pendingForCaptcha) messages.pop();
                    var tErr = getChatT();
                    var isAbort = err && err.name === "AbortError";
                    messages.push({ role: "assistant", content: isAbort ? tErr.chatTimeout : tErr.chatConnError });
                    renderMessages();
                }).finally(function () {
                    clearTimeout(abortTimer);
                    setChatInputBusy(false);
                });
            }

            function isCompactLayoutChrome() {
                try {
                    /* ≤1024 : iPhone sans meta viewport peut annoncer ~980px de large */
                    if (window.innerWidth > 0 && window.innerWidth <= 1024) return true;
                    if (
                        window.innerHeight > 0 &&
                        window.innerHeight <= 560 &&
                        window.innerWidth > 0 &&
                        window.innerWidth <= 1100
                    ) {
                        return true;
                    }
                    if (
                        window.matchMedia &&
                        window.matchMedia("(pointer: coarse)").matches &&
                        window.innerWidth <= 1024
                    ) {
                        return true;
                    }
                } catch (e) {}
                if (!window.matchMedia) return false;
                try {
                    if (window.matchMedia("(max-width: 1024px)").matches) return true;
                } catch (e2) {}
                return false;
            }

            function clearChatFabForcedLayout() {
                var wrap = document.getElementById("chatToggleWrap");
                var panel = document.getElementById("chatPanel");
                var avatar = wrap && wrap.querySelector(".chat-toggle-avatar");
                var btn = document.getElementById("chatToggle");
                if (wrap) wrap.removeAttribute("style");
                if (panel) {
                    panel.style.removeProperty("z-index");
                    panel.style.removeProperty("bottom");
                    panel.style.removeProperty("right");
                }
                if (avatar) avatar.removeAttribute("style");
                if (btn) btn.removeAttribute("style");
            }

            window.applyChatWidgetLang = function (lang) {
                var t = CHAT_I18N[lang] || CHAT_I18N.en;
                var titleEl = document.getElementById("chatPanelTitle");
                if (titleEl) titleEl.textContent = t.chatTitle;
                var footerChatBtn = document.getElementById("siteFooterChatBtn");
                if (footerChatBtn && t.chatTitle) {
                    footerChatBtn.setAttribute("aria-label", t.chatTitle);
                    footerChatBtn.setAttribute("title", t.chatTitle);
                }
                if (inputEl) inputEl.placeholder = t.chatPlaceholder;
                var sendBtn = document.getElementById("chatSend");
                if (sendBtn) sendBtn.textContent = t.chatSend;
                var helpEl = document.getElementById("captchaHelp");
                if (helpEl) helpEl.textContent = t.captchaHelp;
                if (captchaResendBtn) captchaResendBtn.textContent = t.captchaResend;
                var known = [CHAT_I18N.fr.chatWelcome, CHAT_I18N.en.chatWelcome];
                if (messages && messages.length > 0 && messages[0].role === "assistant" && known.indexOf(messages[0].content) !== -1) {
                    messages[0].content = t.chatWelcome;
                    renderMessages();
                }
            };

            function resetChatPanelDockStyles() {
                if (!panel) return;
                panel.removeAttribute("data-chat-dock");
                [
                    "bottom",
                    "left",
                    "right",
                    "top",
                    "transform",
                    "max-height",
                ].forEach(function (prop) {
                    panel.style.removeProperty(prop);
                });
            }

            function positionChatPanelAboveFooterButton() {
                var btn = document.getElementById("siteFooterChatBtn");
                if (!panel || !btn) return;
                var gap = 12;
                var r = btn.getBoundingClientRect();
                var vw = window.innerWidth;
                var vh = window.innerHeight;
                if (r.width === 0 && r.height === 0) return;
                var bottomPx = vh - r.top + gap;
                var isSmallScreen = false;
                try {
                    isSmallScreen = window.matchMedia("(max-width: 640px)").matches;
                } catch (eSmall) {}
                var maxBaseW = Math.min(340, vw - 32);
                var panelW = isSmallScreen ? Math.max(80, Math.floor(maxBaseW / 2)) : maxBaseW;
                var leftPx = r.left + r.width / 2 - panelW / 2;
                var pad = 12;
                leftPx = Math.max(pad, Math.min(leftPx, vw - panelW - pad));
                var availH = r.top - gap - pad;
                var maxH = isSmallScreen
                    ? Math.min(210, Math.max(60, availH))
                    : Math.min(420, Math.max(120, availH));
                panel.style.setProperty("bottom", bottomPx + "px", "important");
                panel.style.setProperty("left", leftPx + "px", "important");
                panel.style.setProperty("right", "auto", "important");
                panel.style.setProperty("transform", "none", "important");
                panel.style.setProperty("max-height", maxH + "px", "important");
            }

            function openChatPanelFromFab() {
                resetChatPanelDockStyles();
                if (panel) panel.classList.add("open");
            }

            function openChatPanelFromFooter() {
                if (!panel) return;
                panel.setAttribute("data-chat-dock", "footer");
                positionChatPanelAboveFooterButton();
                panel.classList.add("open");
                requestAnimationFrame(function () {
                    requestAnimationFrame(positionChatPanelAboveFooterButton);
                });
            }

            function closeChatPanel() {
                if (!panel) return;
                panel.classList.remove("open");
                resetChatPanelDockStyles();
            }

            var toggleWrap = document.getElementById("chatToggleWrap");
            if (toggleWrap) toggleWrap.onclick = openChatPanelFromFab;
            var footerChatBtn = document.getElementById("siteFooterChatBtn");
            if (footerChatBtn) footerChatBtn.onclick = openChatPanelFromFooter;
            var closeBtn = document.getElementById("chatClose");
            if (closeBtn) closeBtn.onclick = closeChatPanel;

            var _footerDockResizeT;
            var _footerDockScrollRaf = null;
            function repositionFooterDockedPanel() {
                if (
                    panel &&
                    panel.classList.contains("open") &&
                    panel.getAttribute("data-chat-dock") === "footer"
                ) {
                    positionChatPanelAboveFooterButton();
                }
            }
            function scheduleFooterDockRepositionOnScroll() {
                if (_footerDockScrollRaf != null) return;
                _footerDockScrollRaf = requestAnimationFrame(function () {
                    _footerDockScrollRaf = null;
                    repositionFooterDockedPanel();
                });
            }
            /* Au scroll de la page, le bouton footer bouge : on recalcule pour garder la fenêtre juste au-dessus */
            window.addEventListener("scroll", scheduleFooterDockRepositionOnScroll, { passive: true });
            window.addEventListener(
                "resize",
                function () {
                    clearTimeout(_footerDockResizeT);
                    _footerDockResizeT = setTimeout(repositionFooterDockedPanel, 100);
                },
                { passive: true }
            );
            window.addEventListener("orientationchange", function () {
                setTimeout(repositionFooterDockedPanel, 250);
            });
            var sendBtn = document.getElementById("chatSend");
            if (sendBtn) sendBtn.onclick = sendToApi;
            if (inputEl) inputEl.addEventListener("keydown", function (e) { if (e.key === "Enter") sendToApi(); });
            renderMessages();
            window.applyChatWidgetLang(savedLang);

            (function () {
                var footer = document.getElementById("siteFooter");
                var wrap = document.getElementById("chatToggleWrap");
                if (!footer || !wrap || !window.IntersectionObserver) return;
                /* Phone / small viewports: keep robot avatar (compact hides image on desktop) */
                if (isCompactLayoutChrome()) return;
                var io = new IntersectionObserver(function (entries) {
                    entries.forEach(function (entry) {
                        wrap.classList.toggle("chat-toggle-compact", entry.isIntersecting);
                    });
                }, { root: null, threshold: 0, rootMargin: "0px" });
                io.observe(footer);
            })();

            function syncMobileLayoutChrome() {
                var root = document.documentElement;
                if (!isCompactLayoutChrome()) {
                    clearChatFabForcedLayout();
                    root.style.removeProperty("--mobile-bottom-clearance");
                    return;
                }
                var wrap = document.getElementById("chatToggleWrap");
                var clearancePx = 148;
                if (wrap && wrap.getBoundingClientRect) {
                    var r = wrap.getBoundingClientRect();
                    if (r.height > 0) {
                        clearancePx = Math.max(
                            clearancePx,
                            Math.ceil(window.innerHeight - r.top + 40)
                        );
                    }
                }
                var bhRaw = (getComputedStyle(root).getPropertyValue("--cookie-banner-height") || "").trim();
                if (bhRaw) {
                    var bn = parseFloat(bhRaw);
                    if (!isNaN(bn)) {
                        clearancePx = Math.max(clearancePx, Math.ceil(bn + 88));
                    }
                }
                root.style.setProperty("--mobile-bottom-clearance", clearancePx + "px");
            }
            window.syncMobileLayoutChrome = syncMobileLayoutChrome;
            window.addEventListener("layout-chrome-sync", syncMobileLayoutChrome);
            document.addEventListener("DOMContentLoaded", syncMobileLayoutChrome);
            if (document.readyState !== "loading") {
                syncMobileLayoutChrome();
            }
            var _layoutChromeTimer;
            window.addEventListener(
                "resize",
                function () {
                    clearTimeout(_layoutChromeTimer);
                    _layoutChromeTimer = setTimeout(syncMobileLayoutChrome, 120);
                },
                { passive: true }
            );
            window.addEventListener("orientationchange", function () {
                setTimeout(syncMobileLayoutChrome, 280);
            });
            requestAnimationFrame(function () {
                requestAnimationFrame(syncMobileLayoutChrome);
            });
        })();
    </script>
    <script>
        /* Indépendant du script principal : si une erreur JS casse le bloc ci-dessus, le FAB reste cliquable. Bannière cookies z-index 10500. */
        (function () {
            function ensureChatFabOnTop() {
                try {
                    var w = document.getElementById("chatToggleWrap");
                    var p = document.getElementById("chatPanel");
                    if (w) {
                        w.style.setProperty("z-index", "10050", "important");
                        w.style.setProperty("position", "fixed", "important");
                    }
                    if (p) {
                        p.style.setProperty("z-index", "10051", "important");
                    }
                } catch (e) {}
            }
            ensureChatFabOnTop();
            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", ensureChatFabOnTop);
            }
            setTimeout(ensureChatFabOnTop, 0);
            setTimeout(ensureChatFabOnTop, 500);
            window.addEventListener("layout-chrome-sync", ensureChatFabOnTop);
        })();
    </script>
