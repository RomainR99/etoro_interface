    <script>
        (function () {
            function applyRiskFooterLang(lang) {
                var isFr = lang !== "en";
                var frBlock = document.getElementById("riskBlockFr");
                var enBlock = document.getElementById("riskBlockEn");
                var frBreak = document.getElementById("riskFrBreak");
                if (frBlock) frBlock.style.display = isFr ? "" : "none";
                if (enBlock) enBlock.style.display = isFr ? "none" : "";
                if (frBreak) frBreak.style.display = isFr ? "" : "none";
            }

            window.applySiteFooterLegalLang = function (lang) {
                var T = {
                    fr: {
                        legal: "Mentions légales",
                        privacy: "Politique de confidentialité",
                        cookies: "Politique de cookies",
                        navAria: "Informations légales",
                    },
                    en: {
                        legal: "Legal notice",
                        privacy: "Privacy policy",
                        cookies: "Cookie policy",
                        navAria: "Legal information",
                    },
                };
                var t = T[lang] || T.en;
                var nav = document.getElementById("siteFooterLegalNav");
                if (nav) nav.setAttribute("aria-label", t.navAria);
                var a = document.getElementById("footerLinkLegal");
                var b = document.getElementById("footerLinkPrivacy");
                var c = document.getElementById("footerLinkCookies");
                if (a) a.textContent = t.legal;
                if (b) b.textContent = t.privacy;
                if (c) c.textContent = t.cookies;
                applyRiskFooterLang(lang);
            };

            var initialLang = "en";
            try {
                initialLang = localStorage.getItem("page_lang") || "en";
            } catch (e) {
                initialLang = "en";
            }
            window.applySiteFooterLegalLang(initialLang);
        })();
    </script>
