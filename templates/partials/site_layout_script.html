    <script>
        (function () {
            var I18N = {
                fr: {
                    copieur: "copieur",
                    copieurs: "copieurs",
                    etoroProfileBtn: "Mon profil sur eToro",
                },
                en: {
                    copieur: "copier",
                    copieurs: "copiers",
                    etoroProfileBtn: "My profile on eToro",
                }
            };

            function applyLanguage(lang) {
                var t = I18N[lang] || I18N.en;
                try {
                    localStorage.setItem("page_lang", lang);
                } catch (e) {}
                var frBtn = document.getElementById("langFrBtn");
                var enBtn = document.getElementById("langEnBtn");
                if (frBtn) frBtn.classList.toggle("active", lang === "fr");
                if (enBtn) enBtn.classList.toggle("active", lang === "en");
                var cb = document.getElementById("copiersBadge");
                if (cb) {
                    var n = Number(cb.getAttribute("data-count") || "0");
                    cb.textContent = n + " " + (n > 1 ? t.copieurs : t.copieur);
                }
                var etoroLbl = document.getElementById("headerEtoroProfileLabel");
                var etoroLink = document.getElementById("headerEtoroProfileLink");
                if (etoroLbl) etoroLbl.textContent = t.etoroProfileBtn;
                if (etoroLink) etoroLink.setAttribute("aria-label", t.etoroProfileBtn);
                var frIds = ["riskTitleFr", "riskTextFr", "riskFrBreak"];
                var enIds = ["riskTitleEn", "riskTextEn"];
                frIds.forEach(function (id) {
                    var el = document.getElementById(id);
                    if (el) el.style.display = lang === "fr" ? "" : "none";
                });
                enIds.forEach(function (id) {
                    var el = document.getElementById(id);
                    if (el) el.style.display = lang === "en" ? "" : "none";
                });
                var lexRoot = document.getElementById("lexPageRoot");
                if (lexRoot) lexRoot.classList.toggle("lang-en", lang === "en");
                var readingRoot = document.getElementById("readingPageRoot");
                if (readingRoot) readingRoot.classList.toggle("lang-en", lang === "en");
                var aboutRoot = document.getElementById("aboutPageRoot");
                if (aboutRoot) aboutRoot.classList.toggle("lang-en", lang === "en");
                if (typeof window.applyChatWidgetLang === "function") {
                    window.applyChatWidgetLang(lang);
                }
                var cookieBn = document.getElementById("cookie-banner");
                if (cookieBn && cookieBn.classList.contains("cookie-banner--visible") && typeof window.refreshCookieBannerLang === "function") {
                    window.refreshCookieBannerLang();
                }
                if (typeof window.refreshLegalCookieMobileLang === "function") {
                    window.refreshLegalCookieMobileLang();
                }
                if (typeof window.refreshNewsletterSignupLang === "function") {
                    window.refreshNewsletterSignupLang(lang);
                }
                if (typeof window.refreshCopyOnEtoroPageLang === "function") {
                    window.refreshCopyOnEtoroPageLang(lang);
                }
                if (typeof window.applySiteFooterLegalLang === "function") {
                    window.applySiteFooterLegalLang(lang);
                }
                (function applyLegalBilingualPageLang() {
                    try {
                        var page = document.body && document.body.getAttribute("data-page");
                        var cfg = {
                            "mentions-legales": {
                                fr: "legalMentionsFr",
                                en: "legalMentionsEn",
                                titleFr: "Mentions légales — romainroth.com",
                                titleEn: "Legal notice — romainroth.com",
                            },
                            confidentialite: {
                                fr: "legalConfidentialiteFr",
                                en: "legalConfidentialiteEn",
                                titleFr: "Politique de confidentialité — romainroth.com",
                                titleEn: "Privacy policy — romainroth.com",
                            },
                            cookies: {
                                fr: "legalCookiesFr",
                                en: "legalCookiesEn",
                                titleFr: "Politique de cookies — romainroth.com",
                                titleEn: "Cookie policy — romainroth.com",
                            },
                        };
                        var c = cfg[page];
                        if (!c) return;
                        var fr = document.getElementById(c.fr);
                        var en = document.getElementById(c.en);
                        if (fr && en) {
                            fr.style.display = lang === "fr" ? "" : "none";
                            en.style.display = lang === "en" ? "" : "none";
                        }
                        document.documentElement.lang = lang === "en" ? "en" : "fr";
                        document.title = lang === "en" ? c.titleEn : c.titleFr;
                    } catch (eLegal) {}
                })();
            }

            var savedLang = "en";
            try {
                savedLang = localStorage.getItem("page_lang") || "en";
            } catch (e) {
                savedLang = "en";
            }
            applyLanguage(savedLang);
            var frBtn = document.getElementById("langFrBtn");
            var enBtn = document.getElementById("langEnBtn");
            if (frBtn) frBtn.addEventListener("click", function () { applyLanguage("fr"); });
            if (enBtn) enBtn.addEventListener("click", function () { applyLanguage("en"); });

            (function () {
                var navHomeBtn = document.getElementById("navHomeBtn");
                var navPostsBtn = document.getElementById("navPostsBtn");
                var headerNavMenu = document.getElementById("headerNavMenu");
                var headerNavToggle = document.getElementById("headerNavToggle");
                function closeHeaderNavMenu() {
                    if (!headerNavMenu || !headerNavToggle) return;
                    headerNavMenu.classList.remove("header-nav-menu--open");
                    headerNavToggle.setAttribute("aria-expanded", "false");
                }
                function isHomePath() {
                    var p = (window.location.pathname || "").replace(/\/+$/, "") || "/";
                    return p === "/" || p === "";
                }
                function goHomeLikeNav() {
                    closeHeaderNavMenu();
                    if (isHomePath()) {
                        window.scrollTo({ top: 0, behavior: "smooth" });
                    } else {
                        window.location.href = "/";
                    }
                }
                if (navHomeBtn) {
                    navHomeBtn.addEventListener("click", goHomeLikeNav);
                }
                var headerHomeHit = document.getElementById("headerHomeHit");
                if (headerHomeHit) {
                    headerHomeHit.addEventListener("click", goHomeLikeNav);
                }
                if (navPostsBtn) {
                    navPostsBtn.addEventListener("click", function () {
                        closeHeaderNavMenu();
                        if (isHomePath()) {
                            var section = document.getElementById("section-posts");
                            if (section) section.scrollIntoView({ behavior: "smooth", block: "start" });
                            else window.location.href = "/#section-posts";
                        } else {
                            window.location.href = "/#section-posts";
                        }
                    });
                }
                if (headerNavMenu) {
                    headerNavMenu.querySelectorAll("a").forEach(function (a) {
                        a.addEventListener("click", closeHeaderNavMenu);
                    });
                    headerNavMenu.addEventListener("click", function (e) {
                        e.stopPropagation();
                    });
                }
                if (headerNavToggle && headerNavMenu) {
                    headerNavToggle.addEventListener("click", function (e) {
                        e.stopPropagation();
                        var open = headerNavMenu.classList.toggle("header-nav-menu--open");
                        headerNavToggle.setAttribute("aria-expanded", open ? "true" : "false");
                    });
                    document.addEventListener("click", closeHeaderNavMenu);
                    document.addEventListener("keydown", function (e) {
                        if (e.key === "Escape") closeHeaderNavMenu();
                    });
                }
            })();

            (function () {
                var header = document.querySelector("header");
                if (!header) return;
                var threshold = 32;
                function syncHeaderCompact() {
                    header.classList.toggle("header--compact", window.scrollY > threshold);
                }
                window.addEventListener("scroll", syncHeaderCompact, { passive: true });
                syncHeaderCompact();
            })();
        })();
    </script>
